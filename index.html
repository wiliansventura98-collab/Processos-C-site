  let lastG=null; const mats=(c.materias||[]).map((m,i)=>{ let g=''; if(m.grupo&&m.grupo!==lastG){g=`<div class="g" style="margin-top:${lastG===null?0:10}px">${esc(m.grupo)}</div>`;lastG=m.grupo}
    return g+`<div class="mat"><span>${esc(m.nome)}</span><input type="range" min="0" max="100" step="5" value="${Number(m.progresso)||0}" data-mat="${i}"><b data-matv="${i}" style="text-align:right">${Number(m.progresso)||0}%</b></div>` }).join('');
  const links=[c.link?`<a class="btn sm" href="${esc(c.link)}" target="_blank" rel="noopener">Página do concurso ↗</a>`:'',c.linkEdital?`<a class="btn sm" href="${esc(c.linkEdital)}" target="_blank" rel="noopener">Edital ↗</a>`:''].join('');
  const statusOpts=STATUS.map(x=>`<option value="${x.k}" ${x.k===c.status?'selected':''}>${x.l}</option>`).join('');
  layer.innerHTML=`<div class="ovl" data-close="1"><aside class="drawer">
    <div class="dhead"><div class="stripe" style="background:${esc(c.cor||'var(--accent)')}"></div>
      <div class="row"><span class="muted">${esc(c.orgao||'')}</span><button class="btn ghost sm" data-close="1">✕ Fechar</button></div>
      <h2>${esc(c.nome)}</h2><div class="sub">${esc([c.cargo,c.enfase].filter(Boolean).join(' · '))}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center">
        <select class="sel" id="stSel" style="border-color:${s.c}">${statusOpts}</select>
        <select class="sel" id="prSel">${Object.entries(PRIOR).map(([k,l])=>`<option value="${k}" ${c.prioridade===k?'selected':''}>Prioridade ${l.toLowerCase()}</option>`).join('')}</select>
        ${links}
      </div>
      ${cnt.length?`<div class="countbig">${cnt.map(x=>`<div><b>${esc(x[0])}</b><span>${esc(x[1])}</span></div>`).join('')}</div>`:''}
      <div class="dtabs">${[['geral','Visão geral'],['refs','Conteúdo e referências'],['bib','Bibliografia'],['quest','Questões']].map(([k,l])=>`<button data-dtab="${k}" class="${drawerTab===k?'on':''}">${l}${k==='refs'&&c.conteudo&&c.conteudo.length?` <small>${topicStats(c).t}</small>`:k==='bib'&&c.conteudo&&c.conteudo.length?` <small>${biblio(c).length}</small>`:''}</button>`).join('')}</div>
    </div>
    ${drawerTab==='refs'?`<div class="dbody">${refSheet(c)}</div>`:drawerTab==='bib'?`<div class="dbody">${biblioSheet(c)}</div>`:drawerTab==='quest'?`<div class="dbody">${qSheet(c)}</div>`:''}
    <div class="dbody" ${drawerTab!=='geral'?'style="display:none"':''}>
      ${facts?`<section class="card sec"><h4>Informações</h4><div class="facts">${facts}</div></section>`:''}
      <section class="card sec"><h4>Cronograma <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:500">marque o que já foi feito</span></h4><div class="tl">${tl||'<div class="muted">Nenhuma data cadastrada. Use “Editar” para adicionar.</div>'}</div></section>
      ${(c.materiais&&c.materiais.length)?`<section class="card sec"><h4>Meus materiais</h4><div class="mat-links">${c.materiais.map(m=>matCard(m)).join('')}</div></section>`:''}
      ${etapas?`<section class="card sec"><h4>Etapas, prazos e recomendações</h4>${etapas}</section>`:''}
      ${(c.conteudo&&c.conteudo.length)?`<section class="card sec"><h4>Conteúdo programático <span style="display:flex;gap:6px"><button class="btn sm" data-dtab="refs" style="text-transform:none;letter-spacing:0">Ver referências por tópico</button><button class="btn sm" data-act="cont" style="text-transform:none;letter-spacing:0">Abrir na aba Conteúdo →</button></span></h4>${c.conteudo.map(b=>`<div class="mat" style="grid-template-columns:1fr 150px 44px"><span>${esc(b.materia)}</span><div class="prog"><i style="width:${blockPct(b)}%"></i></div><b style="text-align:right">${blockPct(b)}%</b></div>`).join('')}<div class="muted" style="margin-top:8px">${topicStats(c).d} de ${topicStats(c).t} tópicos estudados · ${pct}% no geral</div></section>`:''}
      ${mats&&!(c.conteudo&&c.conteudo.length)?`<section class="card sec"><h4>Matérias e progresso <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:500">${pct}% no geral</span></h4>${mats}</section>`:''}
      <section class="card sec"><h4>Anotações <span class="saved" id="savedNote"></span></h4><textarea class="notes" id="notesTa" placeholder="Estratégia, pontos fortes e fracos, links de material…">${esc(c.notas||'')}</textarea></section>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn primary" data-act="edit">✎ Editar</button>
        <button class="btn" data-act="dup">⧉ Duplicar (outro cargo)</button>
        <button class="btn danger" data-act="del" style="margin-left:auto">Excluir</button>
      </div>
    </div></aside></div>`;
  const dr=layer.querySelector('.drawer'); dr.scrollTop=prevScroll;
  dr.addEventListener('click',ev=>ev.stopPropagation());
  dr.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',closeLayer));
  layer.querySelector('.ovl').addEventListener('click',e=>{ if(e.target.classList.contains('ovl')) closeLayer() });
  $('#stSel').onchange=e=>{ const n=clone(c); n.status=e.target.value; saveItem(n); toast('Status atualizado') };
  $('#prSel').onchange=e=>{ const n=clone(c); n.prioridade=e.target.value; saveItem(n) };
  dr.querySelectorAll('[data-etgo]').forEach(a=>a.onclick=e=>{ e.preventDefault(); const el=dr.querySelector('#et'+a.dataset.etgo); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}) });
  dr.querySelectorAll('[data-etchk]').forEach(b=>b.onchange=()=>{ const [ei,ci]=b.dataset.etchk.split('|').map(Number); const n=clone(c); if(n.etapas[ei]&&n.etapas[ei].check&&n.etapas[ei].check[ci]){ n.etapas[ei].check[ci].feito=b.checked; saveItem(n) } });
  dr.querySelectorAll('[data-etplan]').forEach(b=>b.onchange=()=>{ const [ei,ci]=b.dataset.etplan.split('|').map(Number); const n=clone(c); if(n.etapas[ei]&&n.etapas[ei].plano&&n.etapas[ei].plano[ci]){ n.etapas[ei].plano[ci].feito=b.checked; saveItem(n) } });
  dr.querySelectorAll('[data-dtab]').forEach(b=>b.onclick=()=>{ drawerTab=b.dataset.dtab; dr.scrollTop=0; renderDrawer(c); layer.querySelector('.drawer').scrollTop=0 });
  const setQ=(qid,val)=>{ const n=clone(c); n.qres={...(n.qres||{})}; if(val==null) delete n.qres[qid]; else n.qres[qid]=val; saveItem(n) };
  dr.querySelectorAll('[data-qa]').forEach(b=>b.onclick=()=>{ const [qid,i]=b.dataset.qa.split('|'); const q=(QB[c.id].questoes||[]).find(x=>x.id===qid); qPick[qid]=+i; setQ(qid,+i===q.gab?1:0) });
  dr.querySelectorAll('[data-qce]').forEach(b=>b.onclick=()=>{ const [qid,v]=b.dataset.qce.split('|'); const q=(QB[c.id].questoes||[]).find(x=>x.id===qid); qPick[qid]=v==='1'; setQ(qid,(v==='1')===q.gab?1:0) });
  dr.querySelectorAll('[data-qredo]').forEach(b=>b.onclick=()=>{ const qid=b.dataset.qredo; delete qPick[qid]; delete qRev[qid]; setQ(qid,null) });
  dr.querySelectorAll('[data-qdone]').forEach(b=>b.onclick=()=>setQ(b.dataset.qdone,1));
  dr.querySelectorAll('[data-qview]').forEach(b=>b.onclick=()=>{ qView=b.dataset.qview; renderDrawer(c) });
  dr.querySelectorAll('[data-qgab]').forEach(b=>b.onclick=()=>{ qGab[b.dataset.qgab]=!qGab[b.dataset.qgab]; renderDrawer(c) });
  dr.querySelectorAll('[data-rr]').forEach(b=>b.onclick=()=>{ const i=b.dataset.rr.lastIndexOf('|'); const k=b.dataset.rr.slice(0,i), v=+b.dataset.rr.slice(i+1); const cur=(c.qres||{})[k]; setQ(k,cur===v?null:v) });
  dr.querySelectorAll('[data-qver]').forEach(b=>b.onclick=()=>{ qRev[b.dataset.qver]=true; renderDrawer(c) });
  dr.querySelectorAll('[data-qrot]').forEach(b=>b.onclick=()=>{ qRot[b.dataset.qrot]=!qRot[b.dataset.qrot]; renderDrawer(c) });
  dr.querySelectorAll('[data-qshow]').forEach(b=>b.onclick=()=>{ qShow=b.dataset.qshow; renderDrawer(c) });
  const qms=dr.querySelector('#qMatSel'); if(qms) qms.onchange=()=>{ qMat=qms.value; renderDrawer(c) };
  dr.querySelectorAll('[data-rf]').forEach(b=>b.onclick=()=>{ refFilter=b.dataset.rf; renderDrawer(c) });
  dr.querySelectorAll('[data-dtchk]').forEach(i=>i.onchange=()=>{ const [bi,ti]=i.dataset.dtchk.split('|').map(Number); const n=clone(c); const t=n.conteudo[bi]&&n.conteudo[bi].topicos[ti]; if(!t) return; t.feito=i.checked; saveItem(n) });
  dr.querySelectorAll('[data-rcopy]').forEach(b=>b.onclick=async()=>{ const txt=sheetText(c,b.dataset.rcopy); try{ await navigator.clipboard.writeText(txt); toast('Copiado — cole no Word ou no Docs') }catch(e){ toast('Não foi possível copiar neste navegador') } });
  dr.querySelectorAll('[data-evchk]').forEach(ch=>ch.onchange=()=>{ const n=clone(c); n.eventos[+ch.dataset.evchk].feito=ch.checked; saveItem(n) });
  dr.querySelectorAll('[data-mat]').forEach(r=>{ r.oninput=()=>{ dr.querySelector(`[data-matv="${r.dataset.mat}"]`).textContent=r.value+'%' };
    r.onchange=()=>{ const n=clone(c); n.materias[+r.dataset.mat].progresso=Number(r.value); saveItem(n) } });
  const ta=$('#notesTa'); let nt;
  const saveNotes=()=>{ clearTimeout(nt); const cur=items.find(x=>x.id===c.id); if(!cur||cur.notas===ta.value) return; const n=clone(cur); n.notas=ta.value; saveItem(n); const sv=$('#savedNote'); if(sv){sv.textContent='salvo'; setTimeout(()=>{ if($('#savedNote')) $('#savedNote').textContent='' },1500)} };
  ta.oninput=()=>{ clearTimeout(nt); nt=setTimeout(()=>{ saveNotes() },1200) };
  ta.onblur=saveNotes;
  dr.querySelector('[data-act=edit]').onclick=()=>openForm(c);
  const ca=dr.querySelector('[data-act=cont]'); if(ca) ca.onclick=()=>{ view='conteudo'; contSel=c.id; closeLayer(); render(); window.scrollTo(0,0) };
  dr.querySelector('[data-act=dup]').onclick=()=>{ const n=clone(c); n.id=uid()+'-'+Date.now().toString(36); n.nome=c.nome+' (cópia)'; n.enfase=''; n.vagas=''; n.status='interessado'; (n.materias||[]).forEach(m=>m.progresso=0); openForm(n,true) };
  dr.querySelector('[data-act=del]').onclick=()=>confirmBox(`Excluir “${c.nome}”?`,'Isso remove o concurso, o cronograma e as anotações.',async()=>{ const id=c.id; closeLayer(); items=items.filter(x=>x.id!==id); render(); await store.remove(id); toast('Concurso excluído') });
}

function confirmBox(title,text,onOk){
  const wrap=document.createElement('div'); wrap.className='ovl center'; wrap.style.zIndex=70;
  wrap.innerHTML=`<div class="modal confirm"><div class="mbody"><h3 style="margin:0;font-family:var(--serif);font-size:22px">${esc(title)}</h3><p style="margin:0;color:var(--ink2)">${esc(text)}</p></div><div class="mfoot"><button class="btn" data-no>Cancelar</button><button class="btn primary" data-ok style="background:var(--danger);border-color:var(--danger);color:#fff">Excluir</button></div></div>`;
  document.body.appendChild(wrap);
  wrap.querySelector('[data-no]').onclick=()=>wrap.remove();
  wrap.onclick=e=>{ if(e.target===wrap) wrap.remove() };
  wrap.querySelector('[data-ok]').onclick=()=>{ wrap.remove(); onOk() };
}

// ---------- form ----------
function blank(){ return {id:'c-'+uid()+Date.now().toString(36), nome:'', orgao:'', banca:'', cargo:'', enfase:'', salario:'', beneficios:'', vagas:'', vagasTotal:'', cadastroReserva:false,
  requisitos:'', regime:'', jornada:'', lotacao:'', localProva:'', taxa:'', validade:'', link:'', linkEdital:'', status:'interessado', prioridade:'media', cor:CORES[Math.floor(Math.random()*CORES.length)],
  eventos:[{titulo:'Inscrições',inicio:'',fim:'',tipo:'inscricao',feito:false},{titulo:'Prova objetiva',inicio:'',fim:'',tipo:'prova',feito:false}], etapas:[], materias:[], notas:'', criado:new Date().toISOString()} }

function openForm(src, isNew){
  const c = src ? clone(src) : blank(); const creating = isNew || !src;
  c.eventos=c.eventos||[]; c.etapas=c.etapas||[]; c.materias=c.materias||[];
  const layer=document.createElement('div'); layer.className='ovl center'; layer.style.zIndex=60;
  const inp=(k,l,cls='',type='text',ph='')=>`<div class="f ${cls}"><label>${l}</label><input type="${type}" name="${k}" value="${esc(c[k]??'')}" placeholder="${esc(ph)}" ${type==='number'?'step="any" min="0"':''}></div>`;
  layer.innerHTML=`<form class="modal" autocomplete="off">
    <div class="mhead"><h3>${creating?'Novo concurso':'Editar concurso'}</h3><button type="button" class="btn ghost sm" data-cancel>✕</button></div>
    <div class="mbody">
      <fieldset><legend>Identificação</legend><div class="fg">
        ${inp('nome','Nome do concurso *','s6','text','Ex.: SP Águas 2026')}
        ${inp('orgao','Órgão','', 'text','Ex.: Agência de Águas do Estado de SP')}
        ${inp('banca','Banca','', 'text','FGV, Cebraspe, Vunesp…')}
        ${inp('cargo','Cargo')}${inp('enfase','Ênfase / área')}
        <div class="f s2"><label>Status</label><select name="status">${STATUS.map(s=>`<option value="${s.k}" ${s.k===c.status?'selected':''}>${s.l}</option>`).join('')}</select></div>
        <div class="f s2"><label>Prioridade</label><select name="prioridade">${Object.entries(PRIOR).map(([k,l])=>`<option value="${k}" ${k===c.prioridade?'selected':''}>${l}</option>`).join('')}</select></div>
        <div class="f s2"><label>Cor</label><div class="colors">${CORES.map(x=>`<button type="button" class="sw ${x===c.cor?'on':''}" data-color="${x}" style="background:${x}"></button>`).join('')}</div></div>
      </div></fieldset>
      <fieldset><legend>Vaga e remuneração</legend><div class="fg">
        ${inp('salario','Salário inicial (R$)','s2','number')}${inp('vagas','Vagas (no seu cargo)','s2','number')}${inp('vagasTotal','Vagas no concurso','s2','number')}
        ${inp('beneficios','Benefícios','', 'text','Vale-refeição, auxílios…')}${inp('requisitos','Requisito','', 'text','Superior em qualquer área…')}
        ${inp('regime','Regime','s2','text','Estatutário / CLT')}${inp('jornada','Jornada','s2','text','40h')}
        <div class="f s2"><label>Cadastro reserva</label><select name="cadastroReserva"><option value="false" ${!c.cadastroReserva?'selected':''}>Não</option><option value="true" ${c.cadastroReserva?'selected':''}>Sim</option></select></div>
        ${inp('lotacao','Lotação')}${inp('localProva','Local da prova')}
        ${inp('taxa','Taxa de inscrição (R$)','s2','number')}${inp('validade','Validade','s2','text','2 anos + 2')}<div class="f s2"></div>
        ${inp('link','Link da página do concurso','', 'url','https://')}${inp('linkEdital','Link do edital','', 'url','https://')}
      </div></fieldset>
      <fieldset><legend>Cronograma</legend>
        <div class="hint" style="margin-bottom:8px">Use “fim” para períodos (inscrições, envio de títulos). O tipo “Prova” alimenta a contagem regressiva.</div>
        <div id="evRows"></div><button type="button" class="btn sm" data-addrow="ev">＋ Data</button></fieldset>
      <fieldset><legend>Etapas e regras da prova</legend><div id="etRows"></div><button type="button" class="btn sm" data-addrow="et">＋ Etapa</button></fieldset>
      <fieldset><legend>Matérias</legend><div class="hint" style="margin-bottom:8px">O grupo serve para separar, ex.: “Conhecimentos gerais (20 q)”.</div><div id="mtRows"></div><button type="button" class="btn sm" data-addrow="mt">＋ Matéria</button></fieldset>
      <fieldset><legend>Anotações</legend><div class="f s6"><textarea name="notas" rows="4">${esc(c.notas||'')}</textarea></div></fieldset>
    </div>
    <div class="mfoot"><button type="button" class="btn" data-cancel>Cancelar</button><button type="submit" class="btn primary">Salvar</button></div>
  </form>`;
  document.body.appendChild(layer);
  const form=layer.querySelector('form');
  const rows={ev:c.eventos.map(clone), et:c.etapas.map(clone), mt:c.materias.map(clone)};
  function sync(){ // read current row inputs back into rows
    form.querySelectorAll('[data-r]').forEach(el=>{ const [kind,i,key]=el.dataset.r.split('|'); if(rows[kind][i]) rows[kind][i][key]=el.value }) }
  function drawRows(){
    form.querySelector('#evRows').innerHTML=rows.ev.map((e,i)=>`<div class="lr ev"><input data-r="ev|${i}|titulo" value="${esc(e.titulo)}" placeholder="O quê (ex.: Inscrições)"><input type="date" data-r="ev|${i}|inicio" value="${esc(e.inicio)}" title="Início / data"><input type="date" data-r="ev|${i}|fim" value="${esc(e.fim||'')}" title="Fim (opcional)"><select data-r="ev|${i}|tipo">${TIPOS.map(t=>`<option value="${t.k}" ${t.k===e.tipo?'selected':''}>${t.l}</option>`).join('')}</select><button type="button" class="x" data-del="ev|${i}">×</button></div>`).join('');
    form.querySelector('#etRows').innerHTML=rows.et.map((e,i)=>`<div class="lr et"><input data-r="et|${i}|nome" value="${esc(e.nome)}" placeholder="Etapa (ex.: Prova objetiva)"><input data-r="et|${i}|detalhe" value="${esc(e.detalhe||'')}" placeholder="Questões, nota mínima, peso…"><button type="button" class="x" data-del="et|${i}">×</button></div>`).join('');
    form.querySelector('#mtRows').innerHTML=rows.mt.map((e,i)=>`<div class="lr mt"><input data-r="mt|${i}|nome" value="${esc(e.nome)}" placeholder="Matéria"><input data-r="mt|${i}|grupo" value="${esc(e.grupo||'')}" placeholder="Grupo"><button type="button" class="x" data-del="mt|${i}">×</button></div>`).join('');
  }
  drawRows();
  form.addEventListener('click',e=>{
    const add=e.target.closest('[data-addrow]'), del=e.target.closest('[data-del]'), col=e.target.closest('[data-color]');
    if(add){ sync(); const k=add.dataset.addrow; rows[k].push(k==='ev'?{titulo:'',inicio:'',fim:'',tipo:'outro',feito:false}:k==='et'?{nome:'',detalhe:''}:{nome:'',grupo:rows.mt.length?rows.mt[rows.mt.length-1].grupo:'',progresso:0}); drawRows(); const last=form.querySelectorAll(`#${k}Rows .lr`); last[last.length-1]?.querySelector('input')?.focus() }
    if(del){ sync(); const [k,i]=del.dataset.del.split('|'); rows[k].splice(+i,1); drawRows() }
    if(col){ c.cor=col.dataset.color; form.querySelectorAll('.sw').forEach(s=>s.classList.toggle('on',s===col)) }
  });
  const close=()=>layer.remove();
  layer.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=close);
  layer.addEventListener('mousedown',e=>{ if(e.target===layer) close() });
  form.onsubmit=async e=>{ e.preventDefault(); sync();
    const fd=new FormData(form); const out=clone(c);
    ['nome','orgao','banca','cargo','enfase','beneficios','requisitos','regime','jornada','lotacao','localProva','validade','link','linkEdital','status','prioridade','notas'].forEach(k=>out[k]=String(fd.get(k)||'').trim());
    ['salario','vagas','vagasTotal','taxa'].forEach(k=>{ const v=fd.get(k); out[k]= v===''||v==null ? '' : Number(v) });
    out.cadastroReserva = fd.get('cadastroReserva')==='true';
    if(!out.nome){ form.querySelector('[name=nome]').focus(); toast('Dê um nome ao concurso'); return }
    out.eventos=rows.ev.filter(x=>x.titulo.trim()||x.inicio).map(x=>({...x,titulo:x.titulo.trim()||tp(x.tipo).l, fim:x.fim||'', feito:!!x.feito}));
    out.etapas=rows.et.filter(x=>x.nome.trim());
    out.materias=rows.mt.filter(x=>x.nome.trim()).map(x=>({...x,progresso:Number(x.progresso)||0}));
    if(!out.criado) out.criado=new Date().toISOString();
    close(); saveItem(out); openId=out.id; render(); toast(creating?'Concurso adicionado':'Alterações salvas');
  };
  setTimeout(()=>form.querySelector('[name=nome]').focus(),50);
}

// ---------- data import/export ----------
function openData(){
  const layer=document.createElement('div'); layer.className='ovl center'; layer.style.zIndex=60;
  const json=JSON.stringify(items.map(x=>x),null,2);
  layer.innerHTML=`<div class="modal"><div class="mhead"><h3>Exportar / importar</h3><button class="btn ghost sm" data-c>✕</button></div>
   <div class="mbody"><p class="hint" style="margin:0">Copie o JSON abaixo como backup, ou cole um JSON (lista de concursos) e clique em Importar. Concursos com o mesmo id são atualizados.</p>
   <textarea class="notes" id="jsonTa" style="min-height:320px;font-family:ui-monospace,monospace;font-size:12px">${esc(json)}</textarea></div>
   <div class="mfoot"><button class="btn" id="bkp">Baixar backup (.json)</button><button class="btn" id="cpy">Copiar</button><button class="btn primary" id="imp">Importar</button></div></div>`;
  document.body.appendChild(layer);
  const close=()=>layer.remove();
  layer.querySelector('[data-c]').onclick=close; layer.addEventListener('mousedown',e=>{ if(e.target===layer) close() });
  layer.querySelector('#cpy').onclick=async()=>{ try{ await navigator.clipboard.writeText(layer.querySelector('#jsonTa').value); toast('Copiado') }catch(e){ layer.querySelector('#jsonTa').select(); toast('Selecionado — use Ctrl+C') } };
  layer.querySelector('#bkp').onclick=async()=>{ const txt=JSON.stringify({perfil, concursos:items},null,2);
    try{ const dl=window.claude&&claude.use?await claude.use('downloads'):null;
      if(dl){ await dl.save({filename:'concursos-backup.json', data:txt}); toast('Backup salvo'); return } }catch(e){ if(e&&e.code==='declined') return }
    try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'})); a.download='concursos-backup.json'; document.body.appendChild(a); a.click(); a.remove(); toast('Backup salvo') }catch(e){ toast('Não foi possível baixar') } };
  layer.querySelector('#imp').onclick=async()=>{ let arr; try{ arr=JSON.parse(layer.querySelector('#jsonTa').value) }catch(e){ toast('JSON inválido'); return }
    if(arr&&!Array.isArray(arr)&&Array.isArray(arr.concursos)){ if(arr.perfil&&arr.perfil.casa){ perfil=arr.perfil; try{ store.saveConfig(perfil) }catch(e){} } arr=arr.concursos }
    if(!Array.isArray(arr)) arr=[arr]; let n=0;
    for(const x of arr){ if(!x||typeof x!=='object'||!x.nome) continue; const o=clone(x); o.id=String(o.id||('c-'+uid())).replace(/[^A-Za-z0-9_\-.~:@+]/g,'-'); await saveItem(o); n++ }
    close(); toast(n+' concurso(s) importado(s)') };
}

// ---------- events ----------
document.addEventListener('click',e=>{
  const tab=e.target.closest('.tab'); if(tab){ view=tab.dataset.v; render(); return }
  if(e.target.closest('#layer')) return;
  const op=e.target.closest('[data-open]'); if(op){ openDrawer(op.dataset.open); return }
  const f=e.target.closest('[data-filter]'); if(f){ filterStatus=f.dataset.filter; render(); return }
  const cal=e.target.closest('[data-cal]'); if(cal){ const d=+cal.dataset.cal; if(d===0){calCursor=new Date();calCursor.setDate(1)} else calCursor.setMonth(calCursor.getMonth()+d); render(); return }
  const act=e.target.closest('[data-act=add]'); if(act){ openForm(); return }
  const ml=e.target.closest('[data-mloc]'); if(ml){ const [cid,i]=ml.dataset.mloc.split('|'); mapSel={cid,i:+i}; const c=items.find(x=>x.id===cid); if(c) focusLocal(c,+i,ml.classList.contains('minerow')); render(); return }
  const mo=e.target.closest('[data-mopen]'); if(mo){ openDrawer(mo.dataset.mopen); return }
  const md=e.target.closest('[data-mdel]'); if(md){ const [cid,i]=md.dataset.mdel.split('|'); const c=items.find(x=>x.id===cid); if(c){ const n=clone(c); n.locais.splice(+i,1); mapSel=null; saveItem(n); toast('Local removido') } return }
  const cs=e.target.closest('[data-csel]'); if(cs){ contSel=cs.dataset.csel; render(); return }
  const bk=e.target.closest('[data-blk]'); if(bk){ const k=bk.dataset.blk; openBlocks.has(k)?openBlocks.delete(k):openBlocks.add(k); render(); return }
  const ce=e.target.closest('[data-cedit]'); if(ce){ openContEditor(); return }
  const cx=e.target.closest('[data-cexp]'); if(cx){ const c=items.find(x=>x.id===contSel); (c&&c.conteudo||[]).forEach((b,i)=>{ const k=c.id+'|'+i; cx.dataset.cexp==='1'?openBlocks.add(k):openBlocks.delete(k) }); render(); return }
});
document.addEventListener('change',e=>{
  if(e.target.id==='sortSel'){ sortBy=e.target.value; render() }
  if(e.target.id==='pastChk'){ agendaPast=e.target.checked; render() }
  if(e.target.id==='contPend'){ contPend=e.target.checked; render() }
  if(e.target.id==='contRefs'){ contRefs=e.target.checked; render() }
  if(e.target.id==='mOnly'){ mapOnlyMine=e.target.checked; render() }
  if(e.target.dataset && e.target.dataset.mvis){ const id=e.target.dataset.mvis; e.target.checked?mapHidden.delete(id):mapHidden.add(id); render() }
  if(e.target.dataset && e.target.dataset.tchk && !e.target.closest('#layer')){ const [bi,ti]=e.target.dataset.tchk.split('|').map(Number); toggleTopic(bi,ti,e.target.checked) }
});
document.addEventListener('input',e=>{ if(e.target.id==='contSearch'){ contQuery=e.target.value; const pos=e.target.selectionStart; render(); const s=$('#contSearch'); if(s){ s.focus(); s.setSelectionRange(pos,pos) } } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ const top=[...document.querySelectorAll('body > .ovl')].pop(); if(top) top.remove(); else if(openId) closeLayer() } });
$('#btnAdd').onclick=()=>openForm();
$('#btnData').onclick=openData;
$('#btnConta').onclick=()=>openGate(false);
const _r=render; render=function(){ _r(); const s=$('#sortSel'); if(s) s.value=sortBy };

// ---------- boot ----------
render();
(async()=>{
  let db=null;
  for(let i=0;i<3 && !(window.claude && typeof window.claude.use==='function');i++) await new Promise(r=>setTimeout(r,100));
  try{ db = window.claude && typeof window.claude.use==='function' ? await window.claude.use('db') : null }catch(e){ db=null }
  if(db){ store=dbStore(db) }
  else if(ghCfg()){ store=ghStore(ghCfg()) }
  else if(location.protocol.startsWith('http')&&!/^(localhost|127\.)/.test(location.hostname)){ store=localStore0(); openGate() }
  else { store=localStore(); (()=>{ try{ if(!sessionStorage.getItem('pc-banner')){ setBanner('Suas alterações ficam salvas neste navegador. Use <b>Dados → Baixar backup</b> de vez em quando e guarde o arquivo em <code>data/concursos.json</code> no repositório.'); sessionStorage.setItem('pc-banner','1') } }catch(e){} })() }
})();
})();

document.addEventListener('click',async e=>{ const b=e.target.closest&&e.target.closest('[data-dl]'); if(!b) return; e.preventDefault(); e.stopPropagation();
  let step='abrir o download';
  const plain=()=>{ const a=document.createElement('a'); a.href=b.dataset.dl.replace(/_docx\.b64\.txt$/,'.docx'); a.download=b.dataset.fn; document.body.appendChild(a); a.click(); a.remove() };
  if(store&&store.mode==='github'){ try{ const path=b.dataset.dl.replace(/_docx\.b64\.txt$/,'.docx'); toast('Baixando…'); const r=await ghReq(store.cfg,path,{raw:true}); if(!r.ok) throw new Error('HTTP '+r.status); const blob=await r.blob(); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=b.dataset.fn; document.body.appendChild(a); a.click(); a.remove() }catch(err){ toast('Não foi possível baixar ('+err.message+')') } return }
  if(!(window.claude&&typeof claude.use==='function')){ plain(); return }
  try{ const dl=await claude.use('downloads'); if(!dl){ plain(); return }
    step='carregar o arquivo';
    const r=await fetch(new URL(b.dataset.dl, location.href)); if(!r.ok) throw {message:'HTTP '+r.status};
    let data;
    if(/\.b64\.txt$/.test(b.dataset.dl)){ const t=(await r.text()).trim(); const bin=atob(t); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); data=u; }
    else data=await r.blob();
    step='salvar';
    await dl.save({filename:b.dataset.fn, data}); toast('Arquivo salvo'); }
  catch(err){ if(err&&err.code==='declined') return; toast('Não foi possível '+step+(err&&(err.code||err.message)?' ('+(err.code||err.message)+')':'')) } }, true);
</script>
