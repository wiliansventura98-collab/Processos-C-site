<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Processos-C · Meus Concursos</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f3ee; --surface:#ffffff; --surface2:#faf9f6; --ink:#1c1d1f; --ink2:#55585e; --ink3:#8a8d93;
  --line:#e4e1d9; --line2:#d3cfc4; --accent:#0e6e78; --accent-ink:#ffffff; --accent-soft:#e2f0f0;
  --danger:#b4382c; --ok:#2f7d4a; --warn:#b06a10;
  --r:14px; --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px -12px rgba(0,0,0,.18);
  --serif:'Fraunces',Georgia,serif; --sans:'Instrument Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding:28px 22px 80px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
h1{font-family:var(--serif);font-weight:650;font-size:34px;letter-spacing:-.02em;margin:0;line-height:1.05}
.sub{color:var(--ink2);margin-top:6px;font-size:14px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line2);background:var(--surface);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:7px;transition:.15s}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface2)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);padding:4px;border-radius:12px;width:max-content;margin-bottom:20px}
.tab{border:0;background:transparent;padding:8px 16px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--ink2);font-size:14px}
.tab.on{background:var(--ink);color:var(--bg)}
.sync{font-size:12.5px;color:var(--ink2);align-self:center;white-space:nowrap}
.gate{max-width:560px}
.gate ol{margin:8px 0 0;padding-left:20px;font-size:13.5px;line-height:1.55}
.gate label{display:block;font-size:12.5px;font-weight:600;margin:12px 0 4px}
.gate input{width:100%;box-sizing:border-box;padding:9px 11px;border:1px solid var(--line2);border-radius:8px;font:inherit;background:var(--surface);color:var(--ink)}
.gate .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gate .err{color:#c8372d;font-size:13px;margin-top:8px;min-height:18px}
.banner{background:var(--surface);border:1px dashed var(--line2);border-radius:12px;padding:10px 14px;color:var(--ink2);font-size:13px;margin-bottom:16px}
.dtabs{display:flex;gap:4px;margin-top:16px;border-bottom:1px solid var(--line);margin-bottom:-1px;flex-wrap:wrap}
.dtabs button{border:0;background:none;padding:9px 12px;font:600 13.5px var(--sans);color:var(--ink2);cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1px}
.dtabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.dtabs small{font-weight:600;color:var(--ink3);margin-left:3px}
.rsheet{padding:18px 20px}
.rs-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:6px}
.rs-act{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 10px;font:600 12.5px var(--sans);color:var(--ink2);cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg)}
.rs-g{margin:22px 0 4px;font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--ink3)}
.rs-m{border:1px solid var(--line);border-radius:12px;margin-top:10px;overflow:hidden}
.rs-mh{display:flex;gap:10px;align-items:center;padding:11px 14px;background:var(--surface2,rgba(0,0,0,.025));border-bottom:1px solid var(--line)}
.rs-mh b{flex:1;font-size:14.5px}
.rs-n{width:24px;height:24px;border-radius:7px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:700 12px var(--sans);flex:none}
.rs-t{padding:11px 14px;border-top:1px dashed var(--line)}
.rs-t:first-of-type{border-top:0}
.rs-th{display:flex;gap:9px;align-items:flex-start;cursor:pointer;font-size:14px;line-height:1.45}
.rs-th input{width:auto;margin-top:3px}
.rs-tn{font:700 12px var(--sans);color:var(--accent);min-width:30px;margin-top:2px}
.rs-t.done .rs-th>span:last-child{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--line2)}
.rs-refs{margin:8px 0 2px 64px;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.rs-refs li,.bib li{font-size:13px;line-height:1.45;color:var(--ink2);display:flex;gap:8px;align-items:baseline}
.rs-refs a,.bib a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:2px}
.rs-none{margin:6px 0 0 64px;font-size:12.5px;color:var(--ink3);font-style:italic}
.rtag{flex:none;font:700 10px var(--sans);text-transform:uppercase;letter-spacing:.06em;padding:2px 6px;border-radius:5px}
.rtag.ed{background:rgba(14,110,120,.12);color:#0b5e66}
.rtag.sg{background:rgba(232,161,0,.15);color:#8a5d00}
.bib{list-style:none;padding:0;margin:6px 0 0;display:flex;flex-direction:column;gap:10px}
.bib-w{font-size:11.5px;color:var(--ink3);margin-top:2px}
.bib-top{margin:12px 0 4px;padding:12px 14px;border-radius:10px;background:rgba(14,110,120,.06);font-size:13px;display:flex;flex-direction:column;gap:5px}
.bib-top>b{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3)}
.bib-top div{display:flex;justify-content:space-between;gap:10px}.bib-top small{color:var(--accent);font-weight:700;flex:none}
@media (max-width:600px){.rs-refs,.rs-none{margin-left:0}}
.qnote{margin:10px 0 4px;font-size:13px;color:var(--ink2);background:rgba(232,161,0,.08);border-radius:9px;padding:10px 12px}
.qprov{margin:14px 0 6px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:9px}
.qprov>b{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3)}
.qp{display:flex;gap:8px;align-items:baseline;font-size:13px}.qp a{color:var(--ink)}
.qstats{margin:12px 0 4px;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.qstats>div{display:grid;grid-template-columns:1fr 120px 36px;gap:8px;align-items:center}
.qcard{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:12px}
.qcard.qok{border-color:rgba(47,143,85,.45)}.qcard.qerr{border-color:rgba(192,57,43,.4)}
.qhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px}
.qn{width:24px;height:24px;border-radius:7px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;flex:none}
.qmat{color:var(--ink2);font-weight:600}.qest{color:var(--ink3);margin-left:auto}
.qredo{border:0;background:none;color:var(--accent);font:600 12px var(--sans);cursor:pointer}
.qtop{font-size:12px;color:var(--ink3);margin-top:6px;font-style:italic}
.qen{font-size:14.5px;line-height:1.55;margin:10px 0}
.qalts,.qce{display:flex;flex-direction:column;gap:6px}.qce{flex-direction:row}
.qalt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line2);background:var(--surface);border-radius:9px;padding:9px 11px;font:14px/1.45 var(--sans);color:var(--ink);cursor:pointer}
.qce .qalt{flex:1;justify-content:center}
.qalt:hover:not([disabled]){border-color:var(--accent);background:rgba(14,110,120,.04)}
.qalt b{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-size:12px}
.qalt[disabled]{cursor:default;opacity:.75}
.qalt.ok{border-color:#2f8f55;background:rgba(47,143,85,.1);opacity:1}.qalt.ok b{background:#2f8f55;color:#fff;border-color:#2f8f55}
.qalt.bad{border-color:#c0392b;background:rgba(192,57,43,.08);opacity:1}.qalt.bad b{background:#c0392b;color:#fff;border-color:#c0392b}
.qfb{margin-top:10px;font-size:13.5px;line-height:1.5;padding:10px 12px;border-radius:9px}
.qfb.ok{background:rgba(47,143,85,.08)}.qfb.bad{background:rgba(192,57,43,.06)}
.qta{min-height:90px}
.qdet{margin-top:8px}.qdet summary{cursor:pointer;font:600 13px var(--sans);color:var(--accent)}
.qrot{margin:10px 0 0;padding-left:20px;font-size:13.5px;line-height:1.5;display:flex;flex-direction:column;gap:4px}
.qfb.neu{background:rgba(14,110,120,.06)}
.qres{font-weight:800;margin-bottom:8px}
.qgab,.qexp{display:grid;grid-template-columns:118px 1fr;gap:10px;align-items:baseline;margin-bottom:8px}
.qgab span,.qexp span{font:700 10.5px var(--sans);text-transform:uppercase;letter-spacing:.07em;color:var(--ink3)}
.qgab b{font-size:14px}.qexp p{margin:0}
.qver{margin-top:10px;border:0;background:none;color:var(--accent);font:600 13px var(--sans);cursor:pointer;padding:0}
.qmod{margin:10px 0;padding:12px 14px;border-radius:9px;background:rgba(14,110,120,.06);font-size:13.5px;line-height:1.6}
.qmod p{margin:6px 0 0}.qsub{display:block;margin-top:10px;font-size:12.5px}
@media (max-width:600px){.qgab,.qexp{grid-template-columns:1fr;gap:2px}}
.rp{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:12px}
.rp-h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.rp-h b{font-size:14px}
.rp-l{font-size:13px;margin:6px 0 2px}.rp-l a{color:var(--ink)}
.rtab{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px}
.rtab th{text-align:left;font:700 10.5px var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);padding:6px 6px;border-bottom:1px solid var(--line)}
.rtab td{padding:6px;border-bottom:1px dashed var(--line);vertical-align:top}
.rtab tr.rok td{background:rgba(47,143,85,.06)}.rtab tr.rerr td{background:rgba(192,57,43,.05)}
.gh{color:var(--ink3)}
.rres{white-space:nowrap}.rres button{border:1px solid var(--line2);background:var(--surface);border-radius:6px;width:26px;height:24px;cursor:pointer;font-weight:700;color:var(--ink3);margin-right:3px}
.rres button.on{background:#2f8f55;color:#fff;border-color:#2f8f55}.rres button.on.bad{background:#c0392b;border-color:#c0392b}
.qsrc{font-size:12.5px;margin-top:6px}.qsrc a{color:var(--accent)}
/* alertas */
.alerts{padding:16px 18px;margin-bottom:22px}
.ahead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}.ahead h3{margin:0;font-family:var(--serif);font-size:20px}.ahead .muted{font-size:13px}
.arow{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:14px;margin-top:4px}
.arow:hover{background:var(--line)}
.arow .adot{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:none}
.arow.crit .adot{background:#c0392b}.arow.warn .adot{background:#e8a100}.arow.info .adot{background:#0e6e78}
.arow.crit{background:rgba(192,57,43,.07)}
.arow .amsg{color:var(--ink2);font-size:13px;margin-top:2px}.arow.crit .amsg{color:#a5281b;font-weight:600}
/* hero */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:22px}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.next{padding:22px 24px;position:relative;overflow:hidden}
.next .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink3);font-weight:700}
.next .big{font-family:var(--serif);font-size:44px;font-weight:650;letter-spacing:-.03em;line-height:1;margin:12px 0 8px}
.next .what{font-size:17px;font-weight:600}
.next .who{color:var(--ink2);font-size:14px;margin-top:2px}
.next .bar{position:absolute;left:0;top:0;bottom:0;width:5px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{padding:16px 18px}
.stat .n{font-family:var(--serif);font-size:30px;font-weight:650;letter-spacing:-.02em;line-height:1}
.stat .t{color:var(--ink2);font-size:13px;margin-top:6px}
/* toolbar */
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--ink2);font-weight:500}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sel{border:1px solid var(--line2);background:var(--surface);border-radius:9px;padding:7px 10px;font-size:13px}
/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.cc{padding:18px 18px 16px;cursor:pointer;position:relative;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column;gap:12px}
.cc:hover{transform:translateY(-2px)}
.cc .stripe{position:absolute;left:18px;right:18px;top:0;height:3px;border-radius:0 0 3px 3px}
.cc h3{margin:0;font-family:var(--serif);font-size:21px;font-weight:650;letter-spacing:-.01em;line-height:1.15}
.cc .role{color:var(--ink2);font-size:13.5px;margin-top:3px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{background:var(--surface2);border-radius:10px;padding:8px 10px}
.kv b{display:block;font-size:15px}
.kv span{font-size:11.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.nextline{font-size:13.5px;color:var(--ink2);display:flex;gap:8px;align-items:baseline}
.nextline strong{color:var(--ink)}
.prog{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px}
.muted{color:var(--ink3);font-size:12.5px}
.empty{padding:50px 24px;text-align:center}
.empty h3{font-family:var(--serif);font-size:24px;margin:0 0 8px}
.empty p{color:var(--ink2);max-width:460px;margin:0 auto 18px}
/* agenda */
.agenda{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:start}
@media (max-width:900px){.agenda{grid-template-columns:1fr}}
.cal{padding:16px}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calhead h3{margin:0;font-family:var(--serif);font-size:22px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{font-size:11px;text-transform:uppercase;color:var(--ink3);font-weight:700;text-align:center;padding:4px 0}
.day{min-height:78px;border-radius:9px;background:var(--surface2);padding:5px 6px;font-size:12px;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.day.out{opacity:.35}
.day.today{outline:2px solid var(--accent)}
.day .dn{font-weight:700;color:var(--ink2)}
.ev{font-size:11px;padding:2px 5px;border-radius:5px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;font-weight:600}
.ev.done{opacity:.45;text-decoration:line-through}
.list{padding:8px 0}
.lgroup{padding:10px 18px 4px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);font-weight:700}
.litem{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:10px 18px;border-top:1px solid var(--line);cursor:pointer}
.litem:hover{background:var(--surface2)}
.litem .d{font-family:var(--serif);font-size:22px;font-weight:650;line-height:1}
.litem .d small{display:block;font-family:var(--sans);font-size:11px;color:var(--ink3);font-weight:600;text-transform:uppercase}
.litem .w{font-weight:600;font-size:14px}
.litem .c{font-size:12.5px;color:var(--ink2);display:flex;gap:6px;align-items:center}
.cd{font-size:12.5px;font-weight:700;white-space:nowrap}
/* compare */
.tablewrap{overflow:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);font-weight:700;background:var(--surface2);position:sticky;top:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface2)}
/* conteúdo */
.cpick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.cpick button{border:1px solid var(--line2);background:var(--surface);border-radius:12px;padding:9px 14px;cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.cpick button.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset}
.cpick button small{color:var(--ink3);font-weight:600}
.chead{padding:18px 20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.chead .big{font-family:var(--serif);font-size:34px;font-weight:650;line-height:1}
.chead .grow{flex:1;min-width:200px}
.search{border:1px solid var(--line2);background:var(--surface);border-radius:9px;padding:8px 12px;font-size:14px;min-width:220px}
.gtitle{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink3);font-weight:700;margin:18px 2px 8px;display:flex;justify-content:space-between}
.blk{margin-bottom:10px;overflow:hidden}
.blkh{display:grid;grid-template-columns:18px 1fr 160px 56px;gap:12px;align-items:center;padding:14px 18px;cursor:pointer;user-select:none}
.blkh:hover{background:var(--surface2)}
.blkh .car{color:var(--ink3);transition:transform .15s;font-size:12px}
.blk.open .blkh .car{transform:rotate(90deg)}
.blkh b{font-size:15px}
.blkh .n{font-size:12.5px;color:var(--ink2);text-align:right;font-weight:600}
@media (max-width:640px){.blkh{grid-template-columns:18px 1fr 56px}.blkh .prog{display:none}}
.tops{border-top:1px solid var(--line);padding:6px 18px 10px 48px}
.top{display:grid;grid-template-columns:20px 1fr;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px;line-height:1.5}
.top label{cursor:pointer;display:block}
.refs{display:flex;flex-direction:column;gap:3px;margin-top:6px}
.ref{font-size:12.5px;color:var(--ink2);display:flex;gap:7px;align-items:baseline;line-height:1.4}
.ref .rt{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:1px 6px;border-radius:5px;flex:none}
.ref .rt.e{background:var(--accent);color:var(--accent-ink)}
.ref .rt.s{background:var(--surface2);border:1px solid var(--line2);color:var(--ink3)}
.ref a{color:var(--ink2);text-decoration:underline;text-decoration-color:var(--line2)}
.ref a:hover{color:var(--accent)}
.legend{display:flex;gap:12px;align-items:center;font-size:12px;color:var(--ink3);margin:2px 2px 0}
.top:last-child{border-bottom:0}
.top.done label>span{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--line2)}
.top input{margin-top:3px}
mark{background:#ffe48a;color:inherit;border-radius:3px;padding:0 1px}
.blkbar{display:flex;align-items:center;gap:8px}
/* mapa */
.mapwrap{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}

.mapcard{position:relative;overflow:hidden;padding:0}
#brmap{width:100%;height:auto;display:block;touch-action:none;cursor:grab;background:var(--surface)}
#brmap.adding{cursor:crosshair}
#brmap .uf{fill:var(--surface2);stroke:var(--line2);stroke-linejoin:round}
#brmap .uflbl{font:600 11px var(--sans);fill:var(--ink3);text-anchor:middle;pointer-events:none}
#brmap .mk{cursor:pointer}
#brmap .mlbl{font:600 11px var(--sans);fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-linejoin:round;pointer-events:none}
.mapctl{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line2);background:var(--surface);cursor:pointer;font-weight:700;font-size:16px;box-shadow:var(--shadow)}
.mapbar{position:absolute;left:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap}
.maphint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:var(--shadow)}
.mside{display:flex;flex-direction:column;gap:12px}
.mside .card{padding:14px 16px}
.mside h4{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink3);font-weight:700}
.lg{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink2)}
.lg div{display:flex;align-items:center;gap:8px}
.ccrow{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px;font-weight:600;cursor:pointer}
.lrow{display:grid;grid-template-columns:16px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-top:1px dashed var(--line);font-size:13px;cursor:pointer}
.lrow:hover{color:var(--accent)}
.mine{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;background:#e8a100;color:#1c1d1f;border-radius:5px;padding:1px 6px;margin-left:4px;vertical-align:1px}
.minecard{border:2px solid #e8a100 !important}
.minerow{display:flex;gap:8px;padding:7px 0;border-top:1px dashed var(--line);font-size:13px;cursor:pointer;align-items:flex-start}
.minerow:first-of-type{border-top:0}
.lrow small{color:var(--ink3)}
.mform{display:flex;flex-direction:column;gap:8px}
.mform input,.mform select{border:1px solid var(--line2);border-radius:8px;padding:7px 9px;background:var(--surface);font-size:13px;width:100%}
/* drawer */
.ovl{position:fixed;inset:0;background:rgba(10,12,14,.45);backdrop-filter:blur(2px);z-index:50;display:flex;justify-content:flex-end;animation:fade .15s}
.ovl.center{justify-content:center;align-items:flex-start;padding:40px 16px;overflow:auto}
@keyframes fade{from{opacity:0}}
.drawer{width:min(760px,100%);height:100%;overflow:auto;background:var(--bg);border-left:1px solid var(--line);animation:slide .2s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:.5}}
.dhead{padding:26px 28px 20px;background:var(--surface);border-bottom:1px solid var(--line);position:relative}
.dhead .stripe{position:absolute;left:0;right:0;top:0;height:5px}
.dhead h2{font-family:var(--serif);font-size:30px;margin:4px 0 2px;letter-spacing:-.02em;line-height:1.1}
.dbody{padding:22px 28px 60px;display:flex;flex-direction:column;gap:18px}
.sec{padding:18px 20px}
.sec h4{margin:0 0 12px;font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink3);font-weight:700;display:flex;justify-content:space-between;align-items:center}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px 18px}
.facts div span{display:block;font-size:11.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.facts div b{font-weight:600;font-size:14.5px}
.countbig{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px}
.countbig div{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:130px}
.countbig b{font-family:var(--serif);font-size:26px;display:block;line-height:1.05}
.countbig span{font-size:12px;color:var(--ink2)}
.tl{position:relative;padding-left:4px}
.tli{display:grid;grid-template-columns:22px 92px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.tli:last-child{border-bottom:0}
.tli.past{opacity:.5}
.tli.now{background:var(--accent-soft);border-radius:8px;padding-left:6px;padding-right:6px;opacity:1}
.tli .dt{font-size:12.5px;color:var(--ink2);font-weight:600}
.tli .tt{font-size:14px}
.tli .tg{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;color:#fff}
.todayline{display:flex;align-items:center;gap:8px;color:var(--accent);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:6px 0}
.todayline::before,.todayline::after{content:"";flex:1;height:2px;background:var(--accent);opacity:.5}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;cursor:pointer}
.mat{display:grid;grid-template-columns:1fr 150px 44px;gap:12px;align-items:center;padding:7px 0}
.mat .g{font-size:11px;color:var(--ink3);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
input[type=range]{accent-color:var(--accent);width:100%}
.matc{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.mat-links .matc a.mm{border:0;padding:0}
.mfs{display:flex;gap:6px;flex-wrap:wrap}
.mfs .mf{cursor:pointer;background:transparent;color:inherit;font:inherit;display:inline-flex;flex-direction:row;padding:4px 10px;border:1px solid var(--line);border-radius:99px;font-size:12.5px;font-weight:600}
.mat-links{display:flex;flex-direction:column;gap:8px}
.mat-links a{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:inherit}
.mat-links a b{font-size:14px}
.mat-links a span{font-size:12.5px;color:var(--ink2)}
.mat-links a:hover{border-color:var(--accent)}
.et-ov{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.et-ov a{flex:0 0 auto;display:flex;flex-direction:column;gap:2px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:inherit;min-width:110px;max-width:170px}
.et-ov a span{font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.et-ov a b{font-size:12.5px;line-height:1.25}
.et-ov a.past{opacity:.5}
.etapa2{padding:14px 0;border-bottom:1px dashed var(--line);scroll-margin-top:80px}
.etapa2:last-child{border-bottom:0}
.et-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.et-head>b{font-size:14.5px}
.et-when{display:flex;flex-direction:column;align-items:flex-end;gap:1px;font-variant-numeric:tabular-nums}
.et-date{font-size:12.5px;font-weight:600}
.et-st{font-size:11.5px;color:var(--ink2)}
.et-when.now .et-st{color:#c8372d;font-weight:600}
.et-when.soon .et-st{color:#d0741a;font-weight:600}
.et-when.past{opacity:.55}
.et-chips{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0 2px}
.et-chip{font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--soft,rgba(127,127,127,.12));color:var(--ink2)}
.et-alert{margin:8px 0 4px;padding:8px 10px;border-left:3px solid #c8372d;background:rgba(200,55,45,.07);border-radius:4px;font-size:13px}
.et-det{margin:6px 0 0;color:var(--ink2);font-size:13.5px;white-space:pre-wrap}
.et-sub{margin:12px 0 5px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);font-weight:700}
.et-recs{margin:0;padding-left:18px;font-size:13.5px}
.et-recs li{margin:3px 0}
.et-plan,.et-chk{display:flex;flex-direction:column;gap:3px}
.et-plan label{display:grid;grid-template-columns:18px 78px 1fr auto;gap:8px;align-items:baseline;font-size:13.5px;cursor:pointer}
.et-plan .d{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.et-plan .n{font-size:11.5px;color:var(--ink2)}
.et-plan label.late .n{color:#c8372d;font-weight:600}
.et-chk label{display:flex;gap:8px;align-items:baseline;font-size:13.5px;cursor:pointer}
.et-plan label.done .t,.et-chk label.done span{text-decoration:line-through;opacity:.55}
.etapa{padding:10px 0;border-bottom:1px dashed var(--line)}
.etapa:last-child{border-bottom:0}
.etapa b{display:block}
.etapa span{color:var(--ink2);font-size:13.5px;white-space:pre-wrap}
textarea.notes{width:100%;min-height:150px;border:1px solid var(--line2);border-radius:10px;padding:12px;background:var(--surface2);resize:vertical;line-height:1.5}
.saved{font-size:11.5px;color:var(--ok);text-transform:none;letter-spacing:0;font-weight:600}
/* form */
.modal{width:min(820px,100%);background:var(--bg);border-radius:18px;border:1px solid var(--line);box-shadow:0 30px 80px -20px rgba(0,0,0,.4);animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.98);opacity:0}}
.mhead{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:var(--surface);border-radius:18px 18px 0 0}
.mhead h3{margin:0;font-family:var(--serif);font-size:24px}
.mbody{padding:20px 24px;display:flex;flex-direction:column;gap:20px}
.mfoot{padding:16px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;background:var(--surface);border-radius:0 0 18px 18px;position:sticky;bottom:0}
fieldset{border:0;padding:0;margin:0}
legend{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink3);font-weight:700;margin-bottom:10px;padding:0}
.fg{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.f{display:flex;flex-direction:column;gap:5px;grid-column:span 3}
.f.s2{grid-column:span 2}.f.s6{grid-column:span 6}.f.s1{grid-column:span 1}
@media (max-width:640px){.f,.f.s2,.f.s1{grid-column:span 6}}
.f label{font-size:12.5px;font-weight:600;color:var(--ink2)}
.f input,.f select,.f textarea,.lr input,.lr select{border:1px solid var(--line2);border-radius:9px;padding:8px 10px;background:var(--surface);width:100%}
.f input:focus,.f select:focus,.f textarea:focus,.lr input:focus,.lr select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.lr{display:grid;gap:8px;align-items:center;margin-bottom:8px}
.lr.ev{grid-template-columns:1.6fr 1fr 1fr 1fr 32px}
.lr.et{grid-template-columns:1fr 2fr 32px}
.lr.mt{grid-template-columns:2fr 1fr 32px}
@media (max-width:640px){.lr.ev,.lr.et,.lr.mt{grid-template-columns:1fr 1fr}}
.x{border:0;background:transparent;cursor:pointer;color:var(--ink3);font-size:18px;border-radius:7px;height:32px}
.x:hover{background:var(--surface2);color:var(--danger)}
.colors{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.sw.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--bg) inset}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:99;animation:pop .15s}
.hint{font-size:12.5px;color:var(--ink3)}
.confirm{width:min(420px,100%);margin-top:18vh}
.loading{padding:60px;text-align:center;color:var(--ink3)}

/* mapa interativo */
.mapcard{min-height:200px}
#lmapslot{height:min(74vh,780px);min-height:460px;border-radius:inherit;overflow:hidden}
#lmap{width:100%;height:100%;font-family:var(--sans)}
#lmap.adding,#lmap.adding .leaflet-interactive{cursor:crosshair}
.lmk{background:none;border:0}
.lmk svg{display:block;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.35))}
.leaflet-tooltip.mk-tip{background:none;border:0;box-shadow:none;padding:0;margin:0;font:600 12px var(--sans);color:var(--gl);text-shadow:0 0 3px var(--halo),0 0 2px var(--halo),0 0 1px var(--halo),0 0 4px var(--halo)}
.leaflet-tooltip.mk-tip:before{display:none}
.mk-tip.k-mine,.mk-tip.k-sel{font-weight:800;font-size:13px}
.mk-tip.k-home{font-weight:700}
#lmap:not(.z6) .mk-tip.k-other{display:none}
#lmap:not(.z11) .mk-tip.k-esc{display:none}
.leaflet-tooltip.dist-tip{background:var(--ink);color:#fff;border:0;border-radius:6px;font:700 12px var(--sans);padding:3px 8px;box-shadow:var(--shadow)}
.leaflet-tooltip.dist-tip:before{display:none}
.glayer{position:absolute;left:0;top:0}
.ml{position:absolute;white-space:nowrap;transform:translateY(-50%);font:600 12px var(--sans);color:var(--gl);text-shadow:0 0 3px var(--halo),0 0 2px var(--halo),0 0 1px var(--halo),0 0 4px var(--halo);pointer-events:none;line-height:1}
.ml.mmine,.ml.msel{font-weight:800;font-size:13px}
.ml.msel{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.ml.mesc{font-weight:600;font-size:12px}
.ml.mhome{font-weight:700}
.gl{position:absolute;white-space:nowrap;transform:translate(-50%,-50%);color:var(--gl2);font:500 11px var(--sans);text-shadow:0 0 3px var(--halo),0 0 2px var(--halo),0 0 1px var(--halo);pointer-events:none;line-height:1}
.gl.dot{transform:translate(-4px,-50%);padding-left:9px;color:var(--gl)}
.gl.dot:before{content:"";position:absolute;left:0;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:var(--gl2);box-shadow:0 0 0 1.5px var(--halo)}
.gl.cap1{font-weight:650;font-size:12px}
.gl.cap2{font-weight:750;font-size:13px}
.gl.cap2:before{width:7px;height:7px;margin-top:-3.5px;background:var(--gl)}
.gl.fx{opacity:.7}
.gl.st{text-transform:uppercase;letter-spacing:.14em;font-weight:600;font-size:11px;color:var(--gl2);opacity:.85}
.gl.st.sig{letter-spacing:.06em;font-weight:700}
.gl.oc{font-style:italic;letter-spacing:.3em;color:var(--water);font-weight:500}
.gl.mun{font-size:11px;color:var(--gl2);font-style:italic}
.mtools{position:absolute;left:12px;top:12px;z-index:800;display:flex;gap:4px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line2);border-radius:10px;padding:4px;box-shadow:var(--shadow)}
.mtools button{border:0;background:transparent;font:600 12.5px var(--sans);color:var(--ink2);padding:6px 9px;border-radius:7px;cursor:pointer}
.mtools button:hover{background:var(--line)}
.mtools button.on{background:var(--ink);color:var(--bg)}
.msep{width:1px;height:18px;background:var(--line2);margin:0 2px}
.mlaypop{display:none;position:absolute;top:calc(100% + 6px);right:0;background:var(--surface);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow);min-width:230px}
.mlaypop.open{display:block}
.mlaypop label{display:flex;gap:8px;align-items:center;font-size:13px;padding:4px 0;cursor:pointer}
.mlaypop input{width:auto}
.lmapmsg{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--surface);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);z-index:900}
.lmapfail{padding:40px;text-align:center;color:var(--ink2)}
.leaflet-container .leaflet-control-attribution{font:11px var(--sans);background:rgba(255,255,255,.75)}
.leaflet-control-scale-line{font:11px var(--sans)}
.leaflet-bar a{width:32px;height:32px;line-height:30px;font-size:18px}
.maphint{z-index:850}

/* ================= Tema Processos-C (v2) ================= */
:root{
  --bg:#f5f7fa; --surface:#ffffff; --surface2:#f8fafc; --ink:#0f172a; --ink2:#475569; --ink3:#94a3b8;
  --line:#e7ebf0; --line2:#d5dce5; --accent:#0f766e; --accent-ink:#ffffff; --accent-soft:#e6f4f2;
  --danger:#dc2626; --ok:#16a34a; --warn:#d97706;
  --r:16px; --shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px -16px rgba(15,23,42,.18);
  --shadow-h:0 2px 4px rgba(15,23,42,.05),0 18px 40px -18px rgba(15,23,42,.28);
  --serif:'Plus Jakarta Sans',system-ui,sans-serif; --sans:'Inter',system-ui,sans-serif; --display:'Plus Jakarta Sans',system-ui,sans-serif;
  color-scheme:light;
}
html,body{background:var(--bg);font-family:var(--sans);font-size:15px;line-height:1.55;font-feature-settings:"cv11","ss01","tnum" 0}
body{background:radial-gradient(1200px 500px at 85% -120px,#e3f2ef 0,transparent 60%),radial-gradient(900px 420px at 20% -160px,#e8eefc 0,transparent 60%),var(--bg);background-attachment:fixed}
h1,h2,h3,h4{font-family:var(--display);letter-spacing:-.015em}
.n,.big,.kv b,.cd b,.nx-d,.tl-tick{font-variant-numeric:tabular-nums}

/* layout com barra lateral */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;padding:22px 14px;border-right:1px solid var(--line);background:rgba(255,255,255,.72);backdrop-filter:blur(10px);z-index:20}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 8px}
.brand .logo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,#0f766e,#2563eb);color:#fff;font:800 18px var(--display);box-shadow:0 6px 16px -6px rgba(15,118,110,.6)}
.brand b{display:block;font:800 15.5px var(--display);letter-spacing:-.01em}
.brand small{display:block;color:var(--ink3);font-size:12px;margin-top:1px}
.side .tabs{display:flex;flex-direction:column;gap:3px;background:none;border:0;padding:0;width:auto;margin:0}
.side .tab{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;font:600 14px var(--sans);color:var(--ink2);text-align:left;transition:background .15s,color .15s}
.side .tab svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.side .tab:hover{background:#eef2f6;color:var(--ink)}
.side .tab.on{background:var(--ink);color:#fff;box-shadow:0 6px 14px -8px rgba(15,23,42,.6)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:4px;align-items:stretch}
.side-foot .btn{justify-content:flex-start;color:var(--ink2)}
.side-foot .sync{padding:6px 10px;font-size:12px;color:var(--ink3);white-space:normal}
.wrap{max-width:1240px;width:100%;margin:0 auto;padding:30px 36px 90px}
header.top{align-items:center;margin-bottom:26px}
.hello{font-size:13px;color:var(--ink3);font-weight:500;margin-bottom:4px}
h1{font:800 32px/1.1 var(--display);letter-spacing:-.025em}
.sub{font-size:14px;color:var(--ink2)}
@media (max-width:920px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;padding:10px 12px;gap:10px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .brand small,.side-foot .sync{display:none}
  .brand{padding:0}
  .side .tabs{flex-direction:row}
  .side .tab span{display:none}
  .side .tab{padding:9px}
  .side-foot{margin:0 0 0 auto;flex-direction:row}
  .wrap{padding:22px 16px 80px}
  h1{font-size:26px}
}

/* botões e controles */
.btn{border-radius:11px;font:600 14px var(--sans);padding:9px 15px;border-color:var(--line2);box-shadow:0 1px 1px rgba(15,23,42,.03)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:0 8px 18px -10px rgba(15,23,42,.7)}
.btn.primary:hover{filter:none;background:#1e293b}
.btn.ghost{box-shadow:none}
.sel{border-radius:11px;border-color:var(--line2);padding:8px 12px;background:var(--surface)}
.chip{border-radius:999px;padding:6px 13px;font-weight:600;font-size:13px;border-color:var(--line2);background:var(--surface)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.card{border-color:var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.muted{color:var(--ink3)}

/* entrada animada */
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
#main.enter .hero>*,#main.enter .duo>*,#main.enter .toolbar,#main.enter .cc{animation:up .5s cubic-bezier(.2,.7,.2,1) both}
#main.enter .stats .stat:nth-child(2){animation-delay:.05s}#main.enter .stats .stat:nth-child(3){animation-delay:.1s}#main.enter .stats .stat:nth-child(4){animation-delay:.15s}
#main.enter .duo>*{animation-delay:.15s}
#main.enter .cc{animation-delay:calc(.2s + var(--i,0)*.05s)}
@keyframes ringin{from{stroke-dashoffset:var(--c)}}
#main.enter .ring-v{animation:ringin 1.1s cubic-bezier(.2,.7,.2,1) both .2s}
@media (prefers-reduced-motion:reduce){#main.enter *{animation:none!important}}

/* hero */
.hero{grid-template-columns:1.25fr 1fr;gap:18px;margin-bottom:18px}
@media (max-width:1100px){.hero{grid-template-columns:1fr}}
.next{padding:24px 26px;cursor:pointer;display:flex;flex-direction:column;gap:18px;background:linear-gradient(160deg,#ffffff 0%,#f4fbf9 100%)}
.next .bar{display:none}
.next-main{display:flex;gap:22px;align-items:center}
.cd{flex:none;width:118px;height:118px;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:color-mix(in srgb,var(--u) 10%,#fff);border:1px solid color-mix(in srgb,var(--u) 22%,#fff)}
.cd b{font:800 50px/1 var(--display);color:var(--u);letter-spacing:-.04em}
.cd span{font-size:12.5px;font-weight:600;color:var(--u);margin-top:4px}
.next .lbl{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:700}
.next .what{font:700 21px/1.25 var(--display);margin-top:8px;letter-spacing:-.015em}
.next .who{display:flex;align-items:center;gap:7px;color:var(--ink2);font-size:13.5px;margin-top:6px}
.next .who i,.tl-name i{width:9px;height:9px;border-radius:3px;flex:none}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;color:var(--k);background:color-mix(in srgb,var(--k) 11%,#fff);white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--k)}
.next .tag{margin-top:9px}
.next-more{border-top:1px dashed var(--line2);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.nx{display:flex;gap:12px;align-items:center;padding:6px 8px;border-radius:10px;cursor:pointer}
.nx:hover{background:var(--surface2)}
.nx-d{font:800 15px var(--display);width:44px;text-align:right;flex:none}
.nx-t{font-size:13.5px;font-weight:600;line-height:1.3}
.nx-t small{display:block;font-weight:500;color:var(--ink3);font-size:12px}
.stats{grid-template-columns:1fr 1fr;gap:14px}
.stat{padding:18px;display:flex;gap:14px;align-items:center}
.stat .ico{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--k) 11%,#fff);color:var(--k)}
.stat .ico svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.stat .n{font:800 30px/1 var(--display);letter-spacing:-.03em;color:var(--ink)}
.stat .n.sm{font-size:21px}
.stat .t{font-size:12.5px;color:var(--ink2);margin-top:5px;line-height:1.35}
.ring-wrap{position:relative;display:grid;place-items:center;flex:none}
.ring-wrap b{position:absolute;font:800 11.5px var(--display)}
.ring-wrap.sm b{font-size:9.5px}

/* linha do tempo + alertas */
.duo{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;margin-bottom:26px;align-items:start}
@media (max-width:1100px){.duo{grid-template-columns:1fr}}
.sec-h{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
.sec-h h3,.alerts h3,.sec-t h3{margin:0;font:800 17px var(--display)}
.sec-h .muted{font-size:12.5px}
.tl{padding:20px 22px}
.tl-legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--ink2)}
.tl-legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.tl-body{position:relative}
.tl-row{display:grid;grid-template-columns:170px 1fr;gap:12px;align-items:center;min-height:34px}
.tl-row+.tl-row{border-top:1px solid #f1f4f7}
.tl-name{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;cursor:pointer;min-width:0}
.tl-name span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-track{position:relative;height:34px}
.tl-axis .tl-track{height:22px}
.tl-tick{position:absolute;top:2px;font-size:11px;color:var(--ink3);font-weight:600;text-transform:capitalize;transform:translateX(-50%);white-space:nowrap}
.tl-tick::after{content:"";position:absolute;left:50%;top:18px;width:1px;height:600px;background:#eef1f5;z-index:-1}
.tl-today{position:absolute;top:0;transform:translateX(-50%)}
.tl-today b{font-size:10.5px;color:#fff;background:var(--danger);padding:1px 6px;border-radius:6px}
.tl-overlay{position:absolute;inset:22px 0 0 0;pointer-events:none;border:0!important}
.tl-overlay .tl-track{height:100%}
.tl-todayline{position:absolute;top:0;bottom:0;width:2px;background:var(--danger);opacity:.5;transform:translateX(-1px)}
.tl-bar,.tl-pt{position:absolute;top:50%;cursor:pointer;transition:transform .15s,box-shadow .15s}
.tl-bar{height:10px;transform:translateY(-50%);border-radius:99px;background:var(--k);opacity:.9;min-width:6px}
.tl-pt{width:12px;height:12px;border-radius:50%;background:var(--k);transform:translate(-50%,-50%);box-shadow:0 0 0 3px #fff}
.tl-pt.prova{width:15px;height:15px;border-radius:4px;transform:translate(-50%,-50%) rotate(45deg);box-shadow:0 0 0 3px #fff,0 4px 10px -2px color-mix(in srgb,var(--k) 60%,transparent)}
.tl-bar.past,.tl-pt.past{opacity:.28}

<script>
(function(){
// ---------- constants ----------
const STATUS = [
  {k:'interessado', l:'Interessado', c:'#8a8d93'},
  {k:'inscrito', l:'Inscrito', c:'#2f6fd6'},
  {k:'estudando', l:'Estudando', c:'#0e8a8f'},
  {k:'prova_feita', l:'Prova feita', c:'#8b5cf6'},
  {k:'aprovado', l:'Aprovado', c:'#2f9e57'},
  {k:'nomeado', l:'Nomeado', c:'#c58b0a'},
  {k:'descartado', l:'Descartado', c:'#b4382c'},
];
const TIPOS = [
  {k:'inscricao', l:'Inscrição', c:'#2f6fd6'},
  {k:'isencao', l:'Isenção/redução', c:'#7c4dcc'},
  {k:'pagamento', l:'Pagamento', c:'#d0741a'},
  {k:'prova', l:'Prova', c:'#c8372d'},
  {k:'resultado', l:'Resultado', c:'#2f8f55'},
  {k:'recurso', l:'Recurso', c:'#6b6f76'},
  {k:'titulos', l:'Títulos/documentos', c:'#b08410'},
  {k:'outro', l:'Outro', c:'#4a5a6a'},
];
const CORES = ['#0e6e78','#2f6fd6','#7c4dcc','#c8372d','#d0741a','#2f8f55','#b08410','#c2417a','#3a4a5c'];
const PRIOR = {alta:'Alta',media:'Média',baixa:'Baixa'};
const st = k => STATUS.find(s=>s.k===k)||STATUS[0];
const tp = k => TIPOS.find(t=>t.k===k)||TIPOS[TIPOS.length-1];

// ---------- state ----------
let items = [];          // [{id, ...data}]
let view = 'painel';
let filterStatus = 'ativos';
let sortBy = 'proximo';
let openId = null;
let calCursor = new Date(); calCursor.setDate(1);
let agendaPast = false;
let contSel = null, contQuery = '', contPend = false, contRefs = true;
const openBlocks = new Set();
let store = null;
let loaded = false;

// ---------- utils ----------
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const uid = () => Math.random().toString(36).slice(2,9);
function matCard(m){
  const files=(m.arquivos||[]).map(a=>`<button type="button" class="mf" data-dl="${esc(a.url)}" data-fn="${esc(a.nome||a.url.split('/').pop())}">${esc(a.t)} ↓</button>`).join('');
  return `<div class="matc"><a class="mm" href="${esc(m.url||((m.arquivos||[])[0]||{}).url||'#')}" target="_blank" rel="noopener"><b>${esc(m.titulo)}</b><span>${esc(m.tipo||'')}${m.obs?' · '+esc(m.obs):''}</span></a>${files?`<div class="mfs">${files}</div>`:''}</div>`;
}
function etapaWhen(x){
  if(!x.inicio) return '';
  const a=pd(x.inicio), b=pd(x.fim||x.inicio); const t=today();
  const rng = x.fim&&x.fim!==x.inicio ? fd(x.inicio,false)+' – '+fd(x.fim) : fd(x.inicio);
  let st='', cls='';
  if(b<t){ st='encerrado'; cls='past' }
  else if(a<=t){ const n=diff(b); st=n===0?'último dia hoje':'prazo máximo '+rel(n); cls='now' }
  else { const n=diff(a); st=(x.fim&&x.fim!==x.inicio?'abre ':'')+rel(n); cls=n<=14?'soon':'' }
  return `<div class="et-when ${cls}"><span class="et-date">${rng}</span><span class="et-st">${st}</span></div>`;
}
function etapasHtml(c){
  const E=c.etapas||[]; if(!E.length) return '';
  const rich=E.some(x=>x.inicio||x.recs||x.check||x.plano);
  if(!rich) return E.map(x=>`<div class="etapa"><b>${esc(x.nome)}</b><span>${esc(x.detalhe||'')}</span></div>`).join('');
  const dated=E.map((x,i)=>({x,i})).filter(o=>o.x.inicio).sort((a,b)=>pd(a.x.inicio)-pd(b.x.inicio));
  const ov = dated.length? `<div class="et-ov">${dated.map(({x,i})=>{ const b=pd(x.fim||x.inicio); const past=b<today(); return `<a href="javascript:void 0" data-etgo="${i}" class="${past?'past':''}"><span>${fd(x.inicio,false)}${x.fim&&x.fim!==x.inicio?' – '+fd(x.fim,false):''}</span><b>${esc(x.curto||x.nome)}</b></a>` }).join('')}</div>`:'';
  return ov + E.map((x,i)=>{
    const chips=[x.carater,x.peso,x.minimo].filter(Boolean).map(v=>`<span class="et-chip">${esc(v)}</span>`).join('');
    const plano=(x.plano&&x.plano.length)?`<div class="et-sub">Plano de preparação</div><div class="et-plan">${x.plano.map((p,ci)=>{ const n=p.ate?diff(pd(p.ate)):null; const late=n!=null&&n<0&&!p.feito; return `<label class="${p.feito?'done':''} ${late?'late':''}"><input type="checkbox" data-etplan="${i}|${ci}" ${p.feito?'checked':''}><span class="d">${p.ate?'até '+fd(p.ate,false):''}</span><span class="t">${esc(p.t)}</span><span class="n">${n==null||p.feito?'':late?'atrasado':rel(n)}</span></label>` }).join('')}</div>`:'';
    const recs=(x.recs&&x.recs.length)?`<div class="et-sub">Recomendações</div><ul class="et-recs">${x.recs.map(r=>`<li>${esc(r)}</li>`).join('')}</ul>`:'';
    const chk=(x.check&&x.check.length)?`<div class="et-sub">Checklist ${x.check.filter(k=>k.feito).length}/${x.check.length}</div><div class="et-chk">${x.check.map((k,ci)=>`<label class="${k.feito?'done':''}"><input type="checkbox" data-etchk="${i}|${ci}" ${k.feito?'checked':''}><span>${esc(k.t)}</span></label>`).join('')}</div>`:'';
    const alerta=x.alerta?`<div class="et-alert">${esc(x.alerta)}</div>`:'';
    const mats=(c.materiais||[]).filter(m=>m.etapa===i);
    const matsH=mats.length?`<div class="et-sub">Materiais prontos</div><div class="mat-links">${mats.map(m=>matCard(m)).join('')}</div>`:'';
    return `<div class="etapa2" id="et${i}"><div class="et-head"><b>${esc(x.nome)}</b>${etapaWhen(x)}</div>${chips?`<div class="et-chips">${chips}</div>`:''}${alerta}${x.detalhe?`<p class="et-det">${esc(x.detalhe)}</p>`:''}${matsH}${plano}${recs}${chk}</div>`;
  }).join('');
}
function today(){const d=new Date();d.setHours(0,0,0,0);return d}
function pd(s){ if(!s) return null; const [y,m,d]=String(s).split('-').map(Number); if(!y) return null; return new Date(y,(m||1)-1,d||1); }
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function diff(d){return Math.round((d-today())/86400000)}
const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function fd(s,withYear=true){const d=pd(s); if(!d) return '—'; return d.getDate()+' '+MES[d.getMonth()]+(withYear?' '+d.getFullYear():'')}
function frange(e){ if(e.fim && e.fim!==e.inicio){const a=pd(e.inicio),b=pd(e.fim); const sameY=a.getFullYear()===b.getFullYear(); return (sameY&&a.getMonth()===b.getMonth()? a.getDate() : fd(e.inicio,!sameY))+' – '+fd(e.fim)} return fd(e.inicio)}
function money(n){ if(n==null||n==='') return '—'; return Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0}) }
function rel(n){ if(n===0) return 'hoje'; if(n===1) return 'amanhã'; if(n===-1) return 'ontem'; if(n>1) return 'em '+n+' dias'; return 'há '+(-n)+' dias' }
function evState(e){ const a=pd(e.inicio), b=pd(e.fim)||a, t=today(); if(!a) return 'na'; if(b<t) return 'past'; if(a<=t&&b>=t) return 'now'; return 'future' }
function sortedEvents(c){ return (c.eventos||[]).filter(e=>e.inicio).slice().sort((x,y)=>x.inicio.localeCompare(y.inicio)) }
function nextEvent(c){
  const evs = sortedEvents(c).filter(e=>!e.feito && evState(e)!=='past');
  if(!evs.length) return null;
  // ongoing first by end date, otherwise earliest start
  const now = evs.filter(e=>evState(e)==='now').sort((a,b)=>(a.fim||a.inicio).localeCompare(b.fim||b.inicio));
  return now[0]||evs[0];
}
function countdown(e){
  const s=evState(e);
  if(s==='now'){ const n=diff(pd(e.fim||e.inicio)); return e.fim&&e.fim!==e.inicio ? (n===0?'termina hoje':'aberto · termina '+rel(n)) : 'hoje' }
  return rel(diff(pd(e.inicio)));
}
function provaEvent(c){ return sortedEvents(c).find(e=>e.tipo==='prova') }
function topicStats(c){ let t=0,d=0; (c.conteudo||[]).forEach(b=>(b.topicos||[]).forEach(x=>{t++; if(x.feito) d++})); return {t,d} }
function blockPct(b){ const n=(b.topicos||[]).length; return n? Math.round(100*(b.topicos.filter(x=>x.feito).length)/n) : 0 }
function studyPct(c){ const ts=topicStats(c); if(ts.t) return Math.round(100*ts.d/ts.t); const m=(c.materias||[]); if(!m.length) return null; return Math.round(m.reduce((s,x)=>s+(Number(x.progresso)||0),0)/m.length) }
function inscricaoEvent(c){ return sortedEvents(c).find(e=>e.tipo==='inscricao') }
function urgencyColor(n){ if(n<=3) return 'var(--danger)'; if(n<=10) return 'var(--warn)'; return 'var(--ink2)' }
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200) }

// ---------- storage ----------
const LKEY='meus-concursos-v1';
function localStore0(){ loaded=true; setTimeout(render,0); return { mode:'none', async saveConfig(){}, async save(){ openGate() }, async remove(){} } }
function localStore(){
  let data={}; try{ data=JSON.parse(localStorage.getItem(LKEY)||'{}') }catch(e){}
  const persist=()=>{ try{localStorage.setItem(LKEY,JSON.stringify(data))}catch(e){} };
  const emit=()=>{ items=Object.entries(data).map(([id,v])=>({...v,id})); loaded=true; render() };
  if(!Object.keys(data).length){
    fetch('data/concursos.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{ if(!j) return emit();
      const arr=Array.isArray(j)?j:(j.concursos||[]); arr.forEach(x=>{ if(x&&x.id){ const o={...x}; delete o.id; data[x.id]=o } });
      if(j.perfil&&j.perfil.casa){ perfil=j.perfil; try{localStorage.setItem(LKEY+'-perfil',JSON.stringify(perfil))}catch(e){} }
      persist(); emit() }).catch(()=>emit());
  } else setTimeout(emit,0);
  try{ const pf=JSON.parse(localStorage.getItem(LKEY+'-perfil')||'null'); if(pf&&pf.casa) perfil=pf }catch(e){}
  return { mode:'local', async saveConfig(p){ try{localStorage.setItem(LKEY+'-perfil',JSON.stringify(p))}catch(e){} }, async save(id,obj){ data[id]=obj; persist(); emit() }, async remove(id){ delete data[id]; persist(); emit() } };
}
// ---------- GitHub (dados no repositório privado) ----------
const GHKEY='pc-gh';
function ghCfg(){ try{ return JSON.parse(localStorage.getItem(GHKEY)||'null') }catch(e){ return null } }
function b64enc(str){ const b=new TextEncoder().encode(str); let s=''; for(let i=0;i<b.length;i+=0x8000) s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000)); return btoa(s) }
function b64dec(b64){ const bin=atob(String(b64).replace(/\s/g,'')); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new TextDecoder().decode(u) }
function ghReq(cfg,path,{method,body,raw}={}){
  const url=`https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${path.split('/').map(encodeURIComponent).join('/')}`+(method?'':`?ref=${encodeURIComponent(cfg.branch||'main')}&_=${Date.now()}`);
  const h={'Authorization':'Bearer '+cfg.token,'Accept':raw?'application/vnd.github.raw':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
  if(body) h['Content-Type']='application/json';
  return fetch(url,{method:method||'GET',headers:h,body,cache:'no-store'});
}
function ghStore(cfg){
  let data={}, sha=null, timer=null, saving=false, dirty=false;
  const setSt=t=>{ const el=$('#syncSt'); if(el) el.textContent=t };
  const emit=()=>{ items=Object.entries(data).map(([id,v])=>({...v,id})); loaded=true; render() };
  const cache=()=>{ try{ localStorage.setItem(LKEY+'-ghcache',JSON.stringify({data,perfil})) }catch(e){} };
  const body=()=>JSON.stringify({perfil,concursos:Object.entries(data).map(([id,v])=>({id,...v}))},null,1);
  async function load(){ setSt('Carregando do GitHub…');
    const r=await ghReq(cfg,cfg.path);
    if(r.status===404){ data={}; sha=null }
    else if(!r.ok) throw new Error(r.status===401?'chave inválida ou expirada':'HTTP '+r.status);
    else { const j=await r.json(); sha=j.sha; let txt=j.content?b64dec(j.content):null;
      if(txt===null){ const rr=await ghReq(cfg,cfg.path,{raw:true}); txt=await rr.text() }
      const o=JSON.parse(txt); const arr=Array.isArray(o)?o:(o.concursos||[]);
      data={}; arr.forEach(x=>{ if(x&&x.id){ const c={...x}; delete c.id; data[x.id]=c } });
      if(o.perfil&&o.perfil.casa) perfil=o.perfil }
    cache(); emit(); setSt('Sincronizado ✓') }
  const put=()=>ghReq(cfg,cfg.path,{method:'PUT',body:JSON.stringify({message:'Atualiza concursos pelo painel',content:b64enc(body()),...(sha?{sha}:{}),branch:cfg.branch||'main'})});
  async function flush(){ if(saving){ schedule(); return } saving=true; dirty=false; setSt('Salvando…');
    try{ let r=await put();
      if(r.status===409||r.status===422){ const g=await ghReq(cfg,cfg.path); if(g.ok){ sha=(await g.json()).sha; r=await put() } }
      if(!r.ok) throw new Error('HTTP '+r.status);
      sha=(await r.json()).content.sha; setSt(dirty?'Salvando…':'Salvo no GitHub ✓') }
    catch(e){ dirty=true; setSt('Erro ao salvar — nova tentativa em 10 s'); setTimeout(()=>{ if(dirty) flush() },10000) }
    finally{ saving=false } }
  function schedule(){ dirty=true; cache(); setSt('Alterações pendentes…'); clearTimeout(timer); timer=setTimeout(flush,1500) }
  try{ const c=JSON.parse(localStorage.getItem(LKEY+'-ghcache')||'null'); if(c&&c.data){ data=c.data; if(c.perfil&&c.perfil.casa) perfil=c.perfil; setTimeout(emit,0) } }catch(e){}

function dbStore(db){

  col.onSnapshot(snap=>{

    items = snap.docs.map(d=>({...d.data(), id:d.id}));

  }, err=>{ clearTimeout(timer); loaded=true; setBanner('Erro ao acessar o armazenamento ('+esc(err.code)+'). Recarregue a página mais tarde.'); render() });
  function q(id,fn){ chains[id]=(chains[id]||Promise.resolve()).then(fn).catch(e=>{ toast(e&&e.code==='quota_exceeded'?'Limite de armazenamento atingido':'Não foi possível salvar'); console.error(e) }); return chains[id] }

    remove(id){ return q(id,()=>col.doc(id).delete()) } };
}

const PRAZO=['inscricao','isencao','pagamento','titulos','recurso'];

    const st=evState(e), d0=diff(pd(e.inicio)), d1=diff(pd(e.fim||e.inicio)); let lv=null, msg='';

function renderTimeline(ativos){

function renderAgenda(){
  if(!items.length) return renderPainel();
  const y=calCursor.getFullYear(), mo=calCursor.getMonth();
  const first=new Date(y,mo,1); const start=new Date(first); start.setDate(1-((first.getDay()+6)%7));
  const byDay={};
  items.filter(c=>c.status!=='descartado').forEach(c=>sortedEvents(c).forEach(e=>{
    const push=(d,suffix)=>{(byDay[d]=byDay[d]||[]).push({c,e,suffix})};
    push(e.inicio, e.fim&&e.fim!==e.inicio?' (início)':'');
    if(e.fim&&e.fim!==e.inicio) push(e.fim,' (fim)');
  }));
  const t=iso(today());
  let cells=['seg','ter','qua','qui','sex','sáb','dom'].map(d=>`<div class="dow">${d}</div>`).join('');
  for(let i=0;i<42;i++){ const d=new Date(start); d.setDate(start.getDate()+i); const k=iso(d);
    if(i>=35 && d.getMonth()!==mo) break;
    const evs=(byDay[k]||[]).map(x=>`<div class="ev ${x.e.feito?'done':''}" style="background:${tp(x.e.tipo).c};box-shadow:inset 3px 0 0 ${esc(x.c.cor||'transparent')}" data-open="${esc(x.c.id)}" title="${esc(x.c.nome+' — '+x.e.titulo+x.suffix)}">${esc(x.e.titulo+x.suffix)}</div>`).join('');
    cells+=`<div class="day ${d.getMonth()!==mo?'out':''} ${k===t?'today':''}"><span class="dn">${d.getDate()}</span>${evs}</div>` }
  let mname=first.toLocaleDateString('pt-BR',{month:'long',year:'numeric'}); mname=mname[0].toUpperCase()+mname.slice(1);
  const cal=`<div class="card cal"><div class="calhead"><button class="btn sm" data-cal="-1">‹</button><h3>${mname}</h3><div style="display:flex;gap:6px"><button class="btn sm" data-cal="0">Hoje</button><button class="btn sm" data-cal="1">›</button></div></div><div class="calgrid">${cells}</div></div>`;
  const up=allUpcoming(agendaPast);
  let lastM='', rows='';
  up.forEach(({c,e,s})=>{ const d=pd(e.inicio); const mk=d.toLocaleDateString('pt-BR',{month:'long',year:'numeric'}); if(mk!==lastM){rows+=`<div class="lgroup">${mk}</div>`;lastM=mk}
    const n = s==='now'? diff(pd(e.fim||e.inicio)) : diff(d);
    rows+=`<div class="litem" data-open="${esc(c.id)}" style="${s==='past'||e.feito?'opacity:.5':''}"><div class="d">${d.getDate()}<small>${['dom','seg','ter','qua','qui','sex','sáb'][d.getDay()]}</small></div>
      <div><div class="w">${esc(e.titulo)}${e.fim&&e.fim!==e.inicio?' <span class="muted">até '+fd(e.fim,false)+'</span>':''}</div><div class="c"><span class="pill" style="padding:1px 7px"><span class="dot" style="background:${esc(c.cor||'var(--accent)')}"></span>${esc(c.nome)}</span><span>${tp(e.tipo).l}</span></div></div>
      <div class="cd" style="color:${s==='past'?'var(--ink3)':urgencyColor(n)}">${e.feito?'✓ feito':countdown(e)}</div></div>` });
  const list=`<div class="card"><div class="row" style="padding:14px 18px 6px"><h4 style="margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink3)">Linha do tempo</h4><label class="muted" style="display:flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" id="pastChk" ${agendaPast?'checked':''}> mostrar passados</label></div><div class="list">${rows||'<div class="muted" style="padding:16px 18px">Nenhuma data futura.</div>'}</div></div>`;
  return `<section class="agenda">${cal}${list}</section>`;
}

function areaMaps(){ const areaFill={}, mineArea={}; mapItems().forEach(c=>{ if(mapHidden.has(c.id)) return; if(!mapOnlyMine) (c.areas||[]).forEach(uf=>{ areaFill[uf]=c.cor||'#0e6e78' }); (c.minhaAreas||[]).forEach(uf=>{ mineArea[uf]=c.cor||'#0e6e78' }) }); return {areaFill,mineArea} }

// rótulos com prevenção de sobreposição
function drawLabels(){
  if(!LM||!LM.data.states) return; const map=LM.map, z=map.getZoom(), size=map.getSize(), b=map.getBounds().pad(.05);
  const boxes=[], out=[];
  const fits=(x,y,w,h)=>{ if(x<-20||y<-10||x+w>size.x+20||y+h>size.y+10) return false; for(const q of boxes){ if(x<q[0]+q[2]&&x+w>q[0]&&y<q[1]+q[3]&&y+h>q[1]) return false } boxes.push([x,y,w,h]); return true };
  // marcadores ocupam espaço
  const ML=[]; const seenK={};
  allLocais().forEach(({c,l,i})=>{ const p=map.latLngToContainerPoint([l.lat,l.lon]); const key=l.lat.toFixed(3)+'_'+l.lon.toFixed(3); const n=seenK[key]=(seenK[key]||0)+1; const px=p.x+(n-1)*16;
    const esc_=l.tipo==='escola', sel=mapSel&&mapSel.cid===c.id&&mapSel.i===i; const hb=esc_?7:10; boxes.push([px-hb,p.y-hb,2*hb,2*hb]);
    const pri=sel?0:(l.minha&&!esc_)?1:esc_?4:3; const show=pri<=1||(esc_?z>=10:z>=6);
    if(show) ML.push({p:{x:px,y:p.y},txt:l.nome,pri,cls:sel?'msel':pri===1?'mmine':esc_?'mesc':'moth',off:esc_?10:(l.minha?18:13)}) });
  if(perfil.casa){ const p=map.latLngToContainerPoint([perfil.casa.lat,perfil.casa.lon]); boxes.push([p.x-10,p.y-10,20,20]); ML.push({p,txt:perfil.casa.nome+' · você',pri:2,cls:'mhome',off:12}) }
  ML.sort((a,b)=>a.pri-b.pri).forEach(m=>{ const fs=m.pri<=1?13:12; const w=m.txt.length*fs*.58+4, h=fs+4; let ok=false;
    for(const [dx,dy,anc] of [[m.off,-h/2,'r'],[-m.off-w,-h/2,'l'],[-w/2,m.off,'b'],[-w/2,-m.off-h,'t']]){ const x=m.p.x+dx, y=m.p.y+dy; if(fits(x,y,w,h)){ const lp=map.containerPointToLayerPoint([x,y+h/2]); out.push(`<div class="ml ${m.cls}" style="left:${lp.x}px;top:${lp.y}px">${esc(m.txt)}</div>`); ok=true; break } }
    if(!ok&&m.pri<=1){ const x=m.p.x+m.off, y=m.p.y-h/2; boxes.push([x,y,w,h]); const lp=map.containerPointToLayerPoint([x,m.p.y]); out.push(`<div class="ml ${m.cls}" style="left:${lp.x}px;top:${lp.y}px">${esc(m.txt)}</div>`) } });
  const add=(lat,lon,txt,cls,fs,dot)=>{ if(!b.contains([lat,lon])) return; const p=map.latLngToContainerPoint([lat,lon]); const w=txt.length*fs*(cls.includes('st')?.68:.56)+(dot?10:0), h=fs+4;
    const x=dot?p.x-4:p.x-w/2, y=p.y-h/2; if(!fits(x,y,w,h)) return; const lp=map.containerPointToLayerPoint([dot?p.x:p.x,p.y]); out.push(`<div class="gl ${cls}${dot?' dot':''}" style="left:${lp.x}px;top:${lp.y}px">${esc(txt)}</div>`) };
  // estados
  if(z<8) LM.data.states.features.forEach(f=>{ const p=f.properties; if(z<5) add(p.ly,p.lx,p.uf,'st sig',11,false); else add(p.ly,p.lx,p.n,'st',z>=6?12:11,false) });
  // países vizinhos e oceano
  if(z<6.5){ add(-31,-43,'OCEANO ATLÂNTICO','oc',12,false); }
  // cidades
  (LM.data.places||[]).forEach(p=>{ const minZ=p.cap===2?3:p.cap===1&&p.br?4:p.r<=3?5:p.r<=5?6:p.r<=7?7:8; if(z<minZ||(!p.br&&z<5&&p.cap!==2)) return;
    const cls=p.cap===2?'city cap2':p.cap===1?'city cap1':'city'; add(p.y,p.x,p.n,cls+(p.br?'':' fx'),p.cap?12.5:11.5,true) });
  // municípios
  if(z>=9) Object.values(LM.mun).forEach(m=>{ if(!m.data||!LM.map.hasLayer(m.layer)) return; m.data.features.forEach(f=>add(f.properties.ly,f.properties.lx,f.properties.n,'mun',z>=11?12:11,false)) });
  LM.labelDiv.innerHTML=out.join('');
}

// ---------- conteúdo ----------
function hl(text,q){ const e=esc(text); if(!q) return e; const n=q.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); const plain=text.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); const i=plain.indexOf(n); if(i<0) return e; return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length)) }
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function renderConteudo(){
  if(!items.length) return renderPainel();
  const list=items.slice().sort((a,b)=>{ const r=x=>x.status==='descartado'?2:(['aprovado','nomeado'].includes(x.status)?1:0); return r(a)-r(b) || String(a.nome).localeCompare(String(b.nome)) });

  const ts=topicStats(c), pct=ts.t?Math.round(100*ts.d/ts.t):0;
  const p=provaEvent(c); const dleft=p&&evState(p)!=='past'?diff(pd(p.inicio)):null;
  const pend=ts.t-ts.d;
  const pace = dleft&&dleft>0&&pend>0 ? `<div class="muted">Ritmo para cobrir tudo até a prova: ~${(pend/(dleft/7)).toFixed(1).replace('.',',')} tópicos por semana</div>` : '';
  const head=`<div class="card chead"><div class="big" style="color:${esc(c.cor||'var(--accent)')}">${pct}%</div>
    <div class="grow"><b>${esc(c.nome)}</b><div class="muted">${ts.d} de ${ts.t} tópicos estudados${dleft!=null?' · prova '+rel(dleft):''}</div>${pace}<div class="prog" style="margin-top:8px"><i style="width:${pct}%;background:${esc(c.cor||'var(--accent)')}"></i></div></div>
    <input class="search" id="contSearch" placeholder="Buscar tópico…" value="${esc(contQuery)}">
    <div style="display:flex;flex-direction:column;gap:4px"><label class="muted" style="display:flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" id="contPend" ${contPend?'checked':''}> só pendentes</label><label class="muted" style="display:flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" id="contRefs" ${contRefs?'checked':''}> referências</label></div>
    <div style="display:flex;gap:6px"><button class="btn sm" data-cexp="1">Expandir tudo</button><button class="btn sm" data-cexp="0">Recolher</button><button class="btn sm" data-cedit="1">✎ Editar</button></div></div>`;
  const q=contQuery.trim(); const nq=norm(q);

    let tops=(b.topicos||[]).map((t,ti)=>({t,ti}));
    const matchB = nq && norm(b.materia).includes(nq);
    if(nq && !matchB) tops=tops.filter(x=>norm(x.t.t).includes(nq) || (x.t.refs||[]).some(r=>norm(r.t).includes(nq)));

    const key=c.id+'|'+bi; const open=openBlocks.has(key)||!!nq||contPend;
    const bp=blockPct(b), done=(b.topicos||[]).filter(x=>x.feito).length;
    html+=`<div class="card blk ${open?'open':''}"><div class="blkh" data-blk="${esc(key)}"><span class="car">▶</span><b>${hl(b.materia,q)}</b><div class="prog"><i style="width:${bp}%;background:${bp===100?'var(--ok)':'var(--accent)'}"></i></div><span class="n">${done}/${(b.topicos||[]).length}</span></div>
      ${open?`<div class="tops">${tops.map(x=>{ const id='t'+bi+'_'+x.ti; const refs=(contRefs&&(x.t.refs||[]).length)?`<div class="refs">${x.t.refs.map(r=>`<div class="ref"><span class="rt ${r.tipo==='edital'?'e':'s'}">${r.tipo==='edital'?'Edital':'Sugestão'}</span>${r.url?`<a href="${esc(r.url)}" target="_blank" rel="noopener">${hl(r.t,q)} ↗</a>`:`<span>${hl(r.t,q)}</span>`}</div>`).join('')}</div>`:''; return `<div class="top ${x.t.feito?'done':''}"><input type="checkbox" id="${id}" data-tchk="${bi}|${x.ti}" ${x.t.feito?'checked':''}><div><label for="${id}"><span>${hl(x.t.t,q)}</span></label>${refs}</div></div>` }).join('')}</div>`:''}</div>`;
  });

  const hasRefs=blocks.some(b=>(b.topicos||[]).some(t=>(t.refs||[]).length));

  return `<div class="cpick">${picks}</div>${head}${legend}${html}`;
}
function toggleTopic(bi,ti,val){ const c=items.find(x=>x.id===contSel); if(!c) return; const n=clone(c); const t=n.conteudo[bi]&&n.conteudo[bi].topicos[ti]; if(!t) return; t.feito=val; saveItem(n) }
function contToText(c){ let out='', g=null; (c.conteudo||[]).forEach(b=>{ if(b.grupo&&b.grupo!==g){ out+=(out?'\n':'')+'## '+b.grupo+'\n'; g=b.grupo } out+='# '+b.materia+'\n'; (b.topicos||[]).forEach(t=>{ out+=t.t+'\n'; (t.refs||[]).forEach(r=>{ out+='> '+(r.tipo==='edital'?'[edital] ':'[sugestão] ')+r.t+(r.url?' | '+r.url:'')+'\n' }) }) }); return out }
function textToCont(txt, old){
  const prev={}; (old||[]).forEach(b=>(b.topicos||[]).forEach(t=>{ if(t.feito) prev[norm(b.materia)+'|'+norm(t.t)]=true }));
  const out=[]; let g='', cur=null;
  txt.split('\n').forEach(raw=>{ const l=raw.trim(); if(!l) return;
